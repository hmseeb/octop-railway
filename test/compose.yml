# Boots the GHCR image exactly as the Railway service will: one volume at
# /data/.octop, HOME=/data, first-run init via the patched entrypoint.
services:
  octop:
    image: ghcr.io/hmseeb/octop-railway:1.0.0-r1
    # Railway runs amd64; the image is amd64-only, so local runs emulate.
    platform: linux/amd64
    ports:
      - "8088:8088"
    volumes:
      - octop-data:/data/.octop
    environment:
      HOME: /data
      OCTOP_PORT: "8088"
      OCTOP_BIND_HOST: "::"
      OCTOP_ADMIN_USERNAME: admin
      OCTOP_DEFAULT_PASSWORD: ${CONTRACT_PASSWORD}
volumes:
  octop-data:
