name: Build and push image
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "TEMPLATE_OVERVIEW.md", "template.json", "test/**", "*.py"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    # Node dashboard build plus pip install plus a Playwright Chromium download.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream Octop at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: TencentCloud/Octop
          ref: v1.0.0
          path: upstream
      - name: Patch entrypoint for Railway's IPv6 private network
        # The stock entrypoint hardcodes `--host 0.0.0.0`, which overrides
        # OCTOP_BIND_HOST (CLI flag > env > config) and is unreachable on
        # Railway. Make the flag honor the env, defaulting to a dual-stack
        # wildcard.
        run: |
          sed -i 's|exec octop run --host 0.0.0.0|exec octop run --host "${OCTOP_BIND_HOST:-::}"|' upstream/docker/docker-entrypoint.sh
          grep -n 'exec octop run' upstream/docker/docker-entrypoint.sh
      - name: Add dual-stack sitecustomize and a final image stage
        # uvicorn single-worker mode goes through asyncio's create_server, which
        # sets IPV6_V6ONLY=1 for explicit hosts, so `::` alone is v6-only while
        # Railway's health checker speaks IPv4. sitecustomize coerces the flag
        # to 0 before bind: one socket, both stacks. Verified empirically in the
        # built image (v6-only without it, dual-stack with it).
        run: |
          cat > upstream/docker/railway-sitecustomize.py <<'EOF'
          """Railway image shim: make every IPv6 listener dual-stack.
          asyncio's create_server sets IPV6_V6ONLY=1 on sockets for explicit hosts,
          which leaves uvicorn bound to :: unreachable over IPv4. Railway's private
          network dials IPv6 while its health checker speaks IPv4, so one socket must
          serve both. Coercing the flag before bind is the standard dual-stack recipe.
          """
          import socket

          _original_socket = socket.socket


          class _DualStackSocket(_original_socket):
              def setsockopt(self, level, optname, value, *args):
                  if level == socket.IPPROTO_IPV6 and optname == socket.IPV6_V6ONLY:
                      value = 0
                  return super().setsockopt(level, optname, value, *args)


          socket.socket = _DualStackSocket
          socket.SocketType = _DualStackSocket
          EOF
          cat >> upstream/docker/Dockerfile <<'EOF'

          # Railway: dual-stack shim (see railway-sitecustomize.py).
          FROM runtime
          COPY docker/railway-sitecustomize.py /opt/octop-railway/sitecustomize.py
          ENV PYTHONPATH=/opt/octop-railway
          EOF
          tail -5 upstream/docker/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          push: true
          # Railway runs amd64. arm64 would double a build that is already long.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/octop-railway:1.0.0-r2
            ghcr.io/${{ github.repository_owner }}/octop-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
